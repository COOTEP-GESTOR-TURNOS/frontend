# nginx sin privilegios (puerto 8080). Sirve la SPA y reenvía la API y el socket al backend
# principal: la web y la API quedan en el mismo origen, así las cookies SameSite funcionan sin CORS.

# Caché: index.html se revalida siempre (si no, el navegador sigue mostrando una versión vieja
# después de publicar); los archivos de /assets llevan un hash en el nombre y nunca cambian.
# Vacío = sin cabecera: la API y el socket deciden su propia caché.
map $uri $control_cache {
  ~^/api/         "";
  ~^/socket\.io/  "";
  ~^/assets/      "public, max-age=31536000, immutable";
  default         "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Cache-Control $control_cache always;

  location /api/ {
    proxy_pass http://backend-principal:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://backend-principal:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Rutas de la SPA (React Router): cualquier otra ruta devuelve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
